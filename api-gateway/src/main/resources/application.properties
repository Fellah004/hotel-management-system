server.port=8080

spring.application.name=api-gateway
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lowerCaseServiceId=true

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**, /api/users/**

# Guest Service
spring.cloud.gateway.routes[1].id=guest-service
spring.cloud.gateway.routes[1].uri=lb://guest-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/guests/**

# Room Service (Rooms, Categories, Amenities)
spring.cloud.gateway.routes[2].id=room-service
spring.cloud.gateway.routes[2].uri=lb://room-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rooms/**, /api/room-categories/**, /api/amenities/**

# Rate Service
spring.cloud.gateway.routes[3].id=rate-service
spring.cloud.gateway.routes[3].uri=lb://rate-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/rates/**

# Reservation Service (Reservations, Waitlist)
spring.cloud.gateway.routes[4].id=reservation-service
spring.cloud.gateway.routes[4].uri=lb://reservation-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reservations/**, /api/waitlist/**

# Payment Service
spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/payments/**

# Billing Service
spring.cloud.gateway.routes[6].id=billing-service
spring.cloud.gateway.routes[6].uri=lb://billing-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/bills/**

# Staff Service (Staff, Attendance, Shifts, Leave)
spring.cloud.gateway.routes[7].id=staff-service
spring.cloud.gateway.routes[7].uri=lb://staff-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/staff/**, /api/attendance/**, /api/shifts/**, /api/leave/**

# Inventory Service
spring.cloud.gateway.routes[8].id=inventory-service
spring.cloud.gateway.routes[8].uri=lb://inventory-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/inventory/**

# Guest Experience Service (Service Requests, Feedback, Complaints, Loyalty)
spring.cloud.gateway.routes[9].id=guest-experience-service
spring.cloud.gateway.routes[9].uri=lb://guest-experience-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/service-requests/**, /api/feedback/**, /api/complaints/**, /api/loyalty/**

# Operations Service (Housekeeping, Room Assignments, Maintenance, Breakage, Expenses, Utilities, Cash Drawer, Shift Handover)
spring.cloud.gateway.routes[10].id=operations-service
spring.cloud.gateway.routes[10].uri=lb://operations-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/housekeeping/**, /api/room-assignments/**, /api/maintenance/**, /api/breakage/**, /api/expenses/**, /api/utilities/**, /api/cash-drawer/**, /api/shift-handover/**

# Reporting Service
spring.cloud.gateway.routes[11].id=reporting-service
spring.cloud.gateway.routes[11].uri=lb://reporting-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/reports/**

# Notification Service
spring.cloud.gateway.routes[12].id=notification-service
spring.cloud.gateway.routes[12].uri=lb://notification-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/notifications/**

# Purchase Service (Suppliers, Purchase Requests, Quotations, Purchase Orders, Goods Receipts, Audit)
spring.cloud.gateway.routes[13].id=purchase-service
spring.cloud.gateway.routes[13].uri=lb://purchase-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/suppliers/**, /api/purchase-requests/**, /api/quotations/**, /api/purchase-orders/**, /api/goods-receipts/**, /api/purchase-audit/**

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

