server.port=8084

spring.application.name=reservation-service
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/reservation_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

resilience4j.circuitbreaker.instances.roomClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.roomClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.roomClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.roomClient.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.rateClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.rateClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.rateClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.rateClient.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.guestClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.guestClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.guestClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.guestClient.waitDurationInOpenState=10000

resilience4j.retry.instances.rateClient.maxAttempts=3
resilience4j.retry.instances.rateClient.waitDuration=1000

management.endpoints.web.exposure.include=health,info,metrics
