server.port=8081

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/auth_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC

security.lockout.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
security.lockout.lock-duration-minutes=${LOCK_DURATION_MINUTES:15}
