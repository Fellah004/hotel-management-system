server.port=8084

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/reservation_db?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC

resilience4j.circuitbreaker.instances.roomService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.roomService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.roomService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.roomService.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.rateService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.rateService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.rateService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.rateService.waitDurationInOpenState=10000

resilience4j.circuitbreaker.instances.paymentService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentService.waitDurationInOpenState=10000

resilience4j.retry.instances.rateService.maxAttempts=3
resilience4j.retry.instances.rateService.waitDuration=1000
